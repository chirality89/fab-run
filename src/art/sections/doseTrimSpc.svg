<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" role="img">
  <title>Dose trim from the SPC trend: resist lines on oxide, with a dotted outline showing the target width. Before the trim the lines are a little too wide; after the trim, on the right, they match the outline. A steady dose shift is corrected, but the random spread between lots stays.</title>
  <rect class="mat-si"    x="0"   y="124" width="260" height="16"/>
  <rect class="mat-oxide" x="0"   y="104" width="260" height="20"/>
  <!-- Before the trim: lines wider than the target outline. -->
  <rect class="mat-resist" x="22"  y="66" width="22" height="38"/>
  <rect class="mat-resist" x="62"  y="66" width="22" height="38"/>
  <!-- After the trim: lines on target. -->
  <rect class="mat-resist" x="150" y="66" width="16" height="38"/>
  <rect class="mat-resist" x="190" y="66" width="16" height="38"/>
  <!-- Target width outlines. -->
  <rect class="mat-ghost" x="25"  y="66" width="16" height="38"/>
  <rect class="mat-ghost" x="65"  y="66" width="16" height="38"/>
  <path class="mat-measure" d="M108 90h28M130 84l6 6-6 6"/>
  <text class="art-label-on-dark" x="6"   y="60">too wide</text>
  <text class="art-label-on-dark" x="150" y="60">on target</text>
  <text class="art-label" x="6"   y="138" display="none"></text>
  <!-- Scale bar. Thin films are drawn at least 6 px thick, so it is a guide, not a ruler. -->
  <path class="mat-measure" d="M208 16h44M208 12v8M252 12v8"/>
  <text class="art-label-on-dark" x="252" y="9" text-anchor="end">200 nm</text>
</svg>
