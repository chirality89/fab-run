<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" role="img">
  <title>Pump-purge cycles before the run: the inside wall of a deposition chamber carries a built-up film. Loose pieces of film have flaked off. Purge gas flows past the wall toward the pump and carries them out, while the pressure swings stir up a few extra small particles near the wafer.</title>
  <rect class="mat-si"      x="0"   y="124" width="260" height="16"/>
  <!-- Chamber wall at the top with its built-up film. -->
  <rect class="mat-barrier" x="0"   y="10"  width="260" height="14"/>
  <rect class="mat-oxide"   x="0"   y="24"  width="90"  height="10"/>
  <rect class="mat-oxide"   x="170" y="24"  width="90"  height="10"/>
  <!-- Film that has come loose in the middle, curling off the wall. -->
  <path class="mat-oxide" d="M90 24h80l-10 8-20 -2-20 6-20-4z"/>
  <!-- Flakes falling, with arrows. -->
  <rect class="mat-particle" x="108" y="62"  width="8" height="6"/>
  <rect class="mat-particle" x="146" y="78"  width="6" height="6"/>
  <path class="mat-measure" d="M112 72v10M149 88v10"/>
  <!-- Small particles stirred up by the pump and vent cycle. -->
  <circle class="mat-particle" cx="40"  cy="110" r="3"/>
  <circle class="mat-particle" cx="206" cy="106" r="3"/>
  <circle class="mat-particle" cx="230" cy="114" r="3"/>
  <text class="art-label-on-dark" x="6"   y="21">chamber wall</text>
  <text class="art-label" x="6"   y="52">built-up film</text>
  <text class="art-label" x="6"   y="138" display="none"></text>
  <!-- Purge gas flows down past the wall toward a pump port, carrying flakes out. -->
  <path class="mat-measure" d="M236 40v70M230 104l6 6 6-6"/>
  <text class="art-label" x="254" y="36" text-anchor="end">gas to pump</text>
  <text class="art-label" x="254" y="138" text-anchor="end">not to scale</text>
</svg>
