<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" role="img">
  <title>Wafer pre-wet: two narrow vias in oxide, lined with barrier and seed. In the left via a gas bubble sits trapped at the bottom, where the plating bath cannot reach. In the right via the pre-wet liquid has filled to the bottom and no bubble remains, so the copper can fill it.</title>
  <rect class="mat-si"      x="0"   y="128" width="260" height="12"/>
  <rect class="mat-oxide"   x="0"   y="42"  width="260" height="86"/>
  <rect class="mat-barrier" x="0"   y="36"  width="260" height="6"/>
  <rect class="mat-seed"    x="0"   y="30"  width="260" height="6"/>
  <!-- Left via, with a trapped bubble at the bottom. -->
  <rect class="mat-barrier" x="40"  y="36"  width="44"  height="84"/>
  <rect class="mat-seed"    x="45"  y="30"  width="34"  height="84"/>
  <rect class="art-hole"    x="51"  y="30"  width="22"  height="78"/>
  <ellipse class="mat-void" cx="62" cy="98" rx="9" ry="10"/>
  <!-- Right via, filled with liquid, no bubble. -->
  <rect class="mat-barrier" x="170" y="36"  width="44"  height="84"/>
  <rect class="mat-seed"    x="175" y="30"  width="34"  height="84"/>
  <rect class="art-hole"    x="181" y="30"  width="22"  height="78"/>
  <path class="mat-measure" d="M183 44q4-4 8 0t8 0M183 64q4-4 8 0t8 0M183 84q4-4 8 0t8 0"/>
  <text class="art-label-on-dark" x="6"   y="16">bubble</text>
  <text class="art-label-on-dark" x="136" y="16">wetted</text>
  <text class="art-label" x="6"   y="88">oxide</text>
  <!-- Scale bar. Thin films are drawn at least 6 px thick, so it is a guide, not a ruler. -->
  <path class="mat-measure" d="M208 16h44M208 12v8M252 12v8"/>
  <text class="art-label-on-dark" x="252" y="9" text-anchor="end">200 nm</text>
</svg>
