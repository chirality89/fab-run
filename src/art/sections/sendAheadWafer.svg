<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" role="img">
  <title>Send-ahead wafer: on the left, resist lines on the one wafer sent ahead, measured with a CD bar and a little narrow; on the right, the rest of the lot exposed with the corrected dose, lines on target.</title>
  <rect class="mat-si"     x="0"   y="110" width="260" height="30"/>
  <rect class="mat-oxide"  x="0"   y="86"  width="260" height="24"/>
  <!-- Left: the send-ahead wafer. Its lines came out narrow. -->
  <rect class="mat-resist" x="26"  y="56"  width="18"  height="30"/>
  <rect class="mat-resist" x="66"  y="56"  width="18"  height="30"/>
  <rect class="mat-resist" x="106" y="56"  width="18"  height="30"/>
  <!-- The CD measurement across the middle line. -->
  <path class="mat-measure" d="M66 48h18M66 44v8M84 44v8"/>
  <text class="art-label-on-dark" x="90" y="51">CD</text>
  <path class="mat-measure" d="M130 26v108"/>
  <!-- Right: the rest of the lot, dose corrected, lines on target. -->
  <rect class="mat-resist" x="144" y="56"  width="22"  height="30"/>
  <rect class="mat-resist" x="184" y="56"  width="22"  height="30"/>
  <rect class="mat-resist" x="224" y="56"  width="22"  height="30"/>
  <text class="art-label-on-dark" x="6"   y="30">send-ahead</text>
  <text class="art-label-on-dark" x="138" y="30">lot, new dose</text>
  <text class="art-label" x="6" y="102">oxide</text>
  <text class="art-label" x="6" y="130">Si</text>
  <!-- Scale bar. Thin films are drawn at least 6 px thick, so it is a guide, not a ruler. -->
  <path class="mat-measure" d="M208 16h44M208 12v8M252 12v8"/>
  <text class="art-label-on-dark" x="252" y="9" text-anchor="end">200 nm</text>
</svg>
